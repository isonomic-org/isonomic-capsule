name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    uses: isonomic-org/.github/.github/workflows/rust-ci.yml@main
    secrets: inherit
    with:
      toolchain: "1.97"
      sdk: true
      # The SDK workspace names isonomic-ui; cargo needs it to read the
      # manifests. Nothing here builds it.
      ui: true
