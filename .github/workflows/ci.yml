name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          path: isonomic-capsule
      # The SDK is a sibling checkout, pinned to the commit in SDK_REF. It is a
      # private repo, so this needs the read-only deploy key in SDK_DEPLOY_KEY.
      - name: Read the pinned SDK commit
        id: sdk
        env:
          KEY: ${{ secrets.SDK_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Secret SDK_DEPLOY_KEY is not set, so the private isonomic-sdk repo cannot be checked out."
            exit 1
          fi
          echo "ref=$(tr -d '[:space:]' < isonomic-capsule/SDK_REF)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: isonomic-org/isonomic-sdk
          ref: ${{ steps.sdk.outputs.ref }}
          path: isonomic-sdk
          ssh-key: ${{ secrets.SDK_DEPLOY_KEY }}
      - uses: dtolnay/rust-toolchain@1.97
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: isonomic-capsule
      - name: Format
        working-directory: isonomic-capsule
        run: cargo fmt --all --check
      - name: Lint
        working-directory: isonomic-capsule
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        working-directory: isonomic-capsule
        run: cargo test --all-features
      - name: Every source and doc file stays under 20 KB
        working-directory: isonomic-capsule
        shell: bash
        run: |
          big=$(git ls-files -z -- '*.rs' '*.md' '*.toml' '*.yml' '*.json' | xargs -0 -r ls -l | awk '$5 > 20480 {print $9" ("$5" bytes)"}')
          if [ -n "$big" ]; then echo "Over 20 KB:"; echo "$big"; exit 1; fi
