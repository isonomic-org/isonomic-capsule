[workspace]
resolver = "2"
members = [
    "crates/capsule-core",
    "crates/registry",
    "crates/supervisor",
    "crates/broker",
    "crates/packaging",
    "crates/appdb",
    "crates/agents",
    "crates/gateway",
    "crates/identity",
    "crates/reports",
    "crates/connections",
    "xtask",
    "bin/isonomic-capsule",
]

[workspace.package]
version = "0.9.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"

[workspace.dependencies]
capsule-core = { path = "crates/capsule-core" }
registry = { path = "crates/registry" }
supervisor = { path = "crates/supervisor" }
broker = { path = "crates/broker" }
packaging = { path = "crates/packaging" }
appdb = { path = "crates/appdb" }
agents = { path = "crates/agents" }
gateway = { path = "crates/gateway" }
identity = { path = "crates/identity" }
reports = { path = "crates/reports" }
connections = { path = "crates/connections" }
bytes = "1"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tar = "0.4"
# System trust store and proxy settings, so the download also works behind a
# corporate proxy.
ureq = { version = "2", features = ["native-certs"] }
# The wire types live in the isonomic-sdk repo. Until both repos exist on
# GitHub this is a sibling checkout; it becomes a pinned git dependency.
isonomic-proto = { path = "../isonomic-sdk/crates/proto", features = ["tokio"] }
# The SDK's client and its conformance checks, for the engine's own tests.
isonomic-client = { path = "../isonomic-sdk/crates/client" }
isonomic-conformance = { path = "../isonomic-sdk/crates/conformance" }
# The report format and what never goes in a report, shared with the window.
isonomic-reports = { path = "../isonomic-sdk/crates/reports" }
# The harness, at the URL and rev the SDK pins, so cargo builds one copy of
# harness-core and the event types match the SDK's.
harness-core = { git = "ssh://git@github.com/isonomic-org/isonomic-harness.git", rev = "ba26c809012068f25ff7405509522c100dc7be68" }
harness-host = { git = "ssh://git@github.com/isonomic-org/isonomic-harness.git", rev = "ba26c809012068f25ff7405509522c100dc7be68" }
harness-preset = { git = "ssh://git@github.com/isonomic-org/isonomic-harness.git", rev = "ba26c809012068f25ff7405509522c100dc7be68" }
harness-toolkit = { git = "ssh://git@github.com/isonomic-org/isonomic-harness.git", rev = "ba26c809012068f25ff7405509522c100dc7be68" }
harness-log = { git = "ssh://git@github.com/isonomic-org/isonomic-harness.git", rev = "ba26c809012068f25ff7405509522c100dc7be68" }
# Local models, from the isonomic-inference sibling checkout at INFERENCE_REF.
isonomic-inference-core = { path = "../isonomic-inference/crates/inference-core" }
isonomic-inference-testkit = { path = "../isonomic-inference/crates/testkit" }
isonomic-llama = { path = "../isonomic-inference/crates/llama" }
isonomic-model-library = { path = "../isonomic-inference/crates/library" }
isonomic-provider = { path = "../isonomic-inference/crates/provider" }
# The Isonomic ID, from the isonomic-id sibling checkout at ID_REF (frozen
# at version 1; never changed from here).
id-check = { path = "../isonomic-id/crates/id-check" }
id-core = { path = "../isonomic-id/crates/id-core" }
id-eth = { path = "../isonomic-id/crates/id-eth" }
id-grants = { path = "../isonomic-id/crates/id-grants" }
id-keys = { path = "../isonomic-id/crates/id-keys" }
id-resource = { path = "../isonomic-id/crates/id-resource" }
# The same key library the identity crates use, for the recovery key.
ring = "0.17"
# The Mac keychain, as the identity crates reach it (macOS only).
security-framework = { version = "3", features = ["OSX_10_15"] }
futures-util = "0.3"
# The model library's HTTP client, with the same features, so types unify.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.33"
tempfile = "3"
thiserror = "2"
# The apps' database client, over the Capsule's Unix socket; no TLS.
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
tokio = { version = "1", features = ["process", "net", "time", "sync", "io-util", "rt-multi-thread", "macros", "fs", "signal"] }

[profile.release]
lto = "thin"
