[workspace]
resolver = "2"
members = [
    "crates/capsule-core",
    "crates/registry",
    "crates/supervisor",
    "crates/broker",
    "crates/packaging",
    "crates/appdb",
    "crates/agents",
    "xtask",
    "bin/isonomic-capsule",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
publish = false

[workspace.dependencies]
capsule-core = { path = "crates/capsule-core" }
registry = { path = "crates/registry" }
supervisor = { path = "crates/supervisor" }
broker = { path = "crates/broker" }
packaging = { path = "crates/packaging" }
appdb = { path = "crates/appdb" }
agents = { path = "crates/agents" }
bytes = "1"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tar = "0.4"
# System trust store and proxy settings, so the download also works behind a
# corporate proxy.
ureq = { version = "2", features = ["native-certs"] }
# The wire types live in the isonomic-sdk repo. Until both repos exist on
# GitHub this is a sibling checkout; it becomes a pinned git dependency.
isonomic-proto = { path = "../isonomic-sdk/crates/proto", features = ["tokio"] }
# The SDK's client and its conformance checks, for the engine's own tests.
isonomic-client = { path = "../isonomic-sdk/crates/client" }
isonomic-conformance = { path = "../isonomic-sdk/crates/conformance" }
# The harness, at the URL and rev the SDK pins, so cargo builds one copy of
# harness-core and the event types match the SDK's.
harness-core = { git = "ssh://git@github.com/isonomic-org/isonomic-harness.git", rev = "7a73ca695254d415332ef39bae2b100e4f791b6c" }
harness-host = { git = "ssh://git@github.com/isonomic-org/isonomic-harness.git", rev = "7a73ca695254d415332ef39bae2b100e4f791b6c" }
harness-preset = { git = "ssh://git@github.com/isonomic-org/isonomic-harness.git", rev = "7a73ca695254d415332ef39bae2b100e4f791b6c" }
harness-toolkit = { git = "ssh://git@github.com/isonomic-org/isonomic-harness.git", rev = "7a73ca695254d415332ef39bae2b100e4f791b6c" }
harness-log = { git = "ssh://git@github.com/isonomic-org/isonomic-harness.git", rev = "7a73ca695254d415332ef39bae2b100e4f791b6c" }
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.33"
tempfile = "3"
thiserror = "2"
# The apps' database client, over the Capsule's Unix socket; no TLS.
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
tokio = { version = "1", features = ["process", "net", "time", "sync", "io-util", "rt-multi-thread", "macros", "fs", "signal"] }

[profile.release]
lto = "thin"
